# 一键启动：Qdrant + Neo4j + RAG 应用
# Ollama 建议跑在宿主机（模型文件大），通过 host.docker.internal 访问。
#
# 用法：
#   1) cp .env.example .env 并填写 NEO4J_PASSWORD 等
#   2) python download_model.py --all        # 下载嵌入+精排模型到 ./models
#   3) docker compose up -d
#   4) 访问 http://localhost:8002
#
# 数据持久化卷：qdrant_storage / neo4j_data / app_data（对话SQLite、导出等）
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: rag_neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: rag_app
    depends_on:
      - qdrant
      - neo4j
    environment:
      # 数据库连接（容器网络内的服务名）
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Qdrant 走宿主机端口映射（app 容器内默认 localhost 不可达，改为宿主机地址）
      # macOS/Windows Docker Desktop 支持 host.docker.internal；Linux 需加 extra_hosts
      - QDRANT_HOST=host.docker.internal
      # 对话 SQLite 存入持久化卷
      - CONVERSATIONS_DB_PATH=/app/data/conversations.db
      # 安全配置（按需填写）
      - RAG_ADMIN_TOKEN=${RAG_ADMIN_TOKEN:-}
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RAG_CORS_ORIGINS=${RAG_CORS_ORIGINS:-}
      # LLM：宿主机 Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8002:8002"
    volumes:
      # 嵌入/精排模型（避免打进镜像）
      - ./models:/app/models
      # 本地 PDF 资料库
      - ./source:/app/source
      # 运行时数据（对话 SQLite、导出、BM25 缓存等）
      - app_data:/app/data
      - app_exports:/app/exports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
  app_data:
  app_exports:
